# Optional on a trusted Linux host. The helper can inspect host processes.
services:
  autotunnel:
    volumes:
      - autotunnel-host-processes:/run/autotunnel-host-processes:ro
  host-processes:
    image: ghcr.io/kongmei-ovo/autotunnel:latest
    restart: unless-stopped
    network_mode: host
    pid: host
    user: "0"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    read_only: true
    command: ["python", "-m", "backend.host_snapshot"]
    volumes:
      - autotunnel-host-processes:/run/autotunnel-host-processes

volumes:
  autotunnel-host-processes:
